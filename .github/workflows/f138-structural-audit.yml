name: F-138 structural audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run F-138 structural checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Wersja rozwojowa rozpakowana"

          python3 -m py_compile             "$ROOT/audyt-systemu-v4/scripts/check_rejestracja_modulow.py"             "$ROOT/audyt-systemu-v4/scripts/check_coverage_coherence.py"             "$ROOT/audyt-systemu-v4/scripts/test_moved_to_shared.py"             "$ROOT/audyt-systemu-v4/scripts/ci_check_shared.py"             "$ROOT/audyt-systemu-v4/scripts/test_f108_consistency.py"             "$ROOT/audyt-systemu-v4/scripts/run_regression_suite.py"

          python3 "$ROOT/audyt-systemu-v4/scripts/check_rejestracja_modulow.py" "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/check_coverage_coherence.py" "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/test_moved_to_shared.py" --repo-root "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/ci_check_shared.py" --repo-root "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/test_f108_consistency.py"

      # Manifesty CHECKSUMS.sha256 każdego skilla + próbne zbudowanie paczek ZIP
      # (zastępuje commitowane katalogi ZIP; paczki publikuje release.yml).
      - name: Verify checksum manifests and build skill ZIPs
        run: python3 scripts/build_skill_zips.py --out "$RUNNER_TEMP/zips"

  # 2026-10-11 (AUDYT-2026-10-11b, zewnętrzne code review: „CI uruchamia garstkę skryptów”):
  # pełny zestaw regresyjny — wszystkie testy T1–T49, testy jednostkowe skilli (T48)
  # i mutacje dowodzące, że każdy bloker potrafi się nie udać (T49). Kod ≠ 0 = blocker.
  # Windows w macierzy: odbiorcy pracują głównie na Windows (CRLF, cp1250, separator \).
  regression-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Bez wymuszania LF w runnerze: .gitattributes (eol=lf) ma działać przy domyślnym core.autocrlf=true.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PyYAML: T38 (manifesty pluginów); python-docx: test .docx walidatora cytowań (T48).
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml python-docx

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python "Wersja rozwojowa rozpakowana/audyt-systemu-v4/scripts/run_regression_suite.py" \
            --repo-root "$GITHUB_WORKSPACE/Wersja rozwojowa rozpakowana"
